name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Check presentation/dataset parity
        run: node tools/export_events.mjs --check

      - name: Check deterministic analysis artifacts
        run: python analysis/audit.py --check

      - name: Run data and page tests
        run: python -m pytest -q
